version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medtwin_backend
    restart: always
    environment:
      JWT_SECRET: supersecretjwtkeymedtwinai2026
      GROQ_API_KEY: ${GROQ_API_KEY:-your_default_groq_key}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://rpc-amoy.polygon.technology}
    env_file:
      - ./ai/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ai:/app/ai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medtwin_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
